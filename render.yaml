# Render.com Blueprint Specification for Zenith Auth Platform
services:
  - type: web
    name: zenith-auth
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zenith-db
          property: connectionString

databases:
  - name: zenith-db
    databaseName: zenith
    user: zenith_admin
    plan: free
    region: oregon
    postgresMajorVersion: 16
